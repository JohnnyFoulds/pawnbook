name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much as you can. Environment details are especially useful for rendering and colour bugs.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Do ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal (if TUI)
      description: e.g. kitty 0.36, Terminal.app 2.14, WezTerm
    validations:
      required: false

  - type: input
    id: colorterm
    attributes:
      label: COLORTERM value
      description: Run `echo $COLORTERM`
    validations:
      required: false

  - type: input
    id: docker
    attributes:
      label: Docker version
      description: Run `docker version --format '{{.Server.Version}}'`
    validations:
      required: false
