<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats — pawnbook</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="top-bar">
    <a href="index.html" class="top-bar__brand">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.73V7h1.5l.5 1H13l1 3H4l1-3h1l.5-1H8V5.73A2 2 0 0 1 7 4a2 2 0 0 1 2-2zm-3 11h6v1H6v-1zm-1 2h8v1H5v-1z"/></svg>
      pawnbook
    </a>
    <nav class="top-bar__nav">
      <a href="index.html"   class="nav-link">Home</a>
      <a href="play.html"    class="nav-link">Play</a>
      <a href="puzzles.html" class="nav-link">Drill <span class="due-badge" id="due-count">0</span></a>
      <a href="games.html"       class="nav-link">Games</a>
      <a href="repertoire.html"  class="nav-link">Repertoire</a>
      <a href="stats.html"       class="nav-link nav-link--active">Stats</a>
    </nav>
  </header>

  <main class="page">
    <!-- Time range filter — scopes all charts below -->
    <div style="display:flex;gap:8px;margin-bottom:24px" id="time-filter">
      <button class="btn btn--ghost" data-range="30" style="font-size:12px;padding:4px 10px">30d</button>
      <button class="btn btn--ghost" data-range="90" style="font-size:12px;padding:4px 10px">90d</button>
      <button class="btn btn--ghost btn--ghost-active" data-range="all" style="font-size:12px;padding:4px 10px">All</button>
    </div>

    <div class="stats-grid">
      <!-- ELO tile -->
      <div class="stat-tile">
        <div class="stat-tile__label">Rating</div>
        <div class="stat-tile__value" id="elo-val">—</div>
        <div class="stat-tile__delta" id="elo-delta"></div>
        <canvas class="sparkline" id="spark-elo" width="120" height="28" style="display:block;margin-top:8px"></canvas>
      </div>

      <!-- Streak tile -->
      <div class="stat-tile" id="streak-tile" style="display:none">
        <div class="stat-tile__label">Streak</div>
        <div class="stat-tile__value" id="streak-val">0</div>
        <div class="stat-tile__delta" style="font-size:12px;color:var(--ink-muted)">day<span id="streak-plural">s</span> in a row</div>
      </div>

      <!-- Style match tile -->
      <div class="stat-tile" id="style-tile" style="display:none">
        <div class="stat-tile__label">Style match</div>
        <div class="stat-tile__value" id="style-val">—</div>
        <div class="stat-tile__delta" id="style-delta" style="font-size:12px;color:var(--ink-muted)"></div>
      </div>

      <!-- Retired mistakes tile (R35) -->
      <div class="stat-tile">
        <div class="stat-tile__label">Mistakes retired</div>
        <div class="stat-tile__value" id="retired-val">0</div>
        <div class="stat-tile__delta" style="font-size:12px;color:var(--ink-muted)">graduated from the queue</div>
        <canvas class="sparkline" id="spark-retired" width="120" height="28" style="display:block;margin-top:8px"></canvas>
      </div>

      <!-- Results tile -->
      <div class="stat-tile">
        <div class="stat-tile__label">Results</div>
        <div style="display:flex;gap:20px;align-items:baseline;margin-top:8px">
          <div>
            <div style="font-size:22px;font-weight:600;color:var(--good)" id="wins-val">0</div>
            <div style="font-size:12px;color:var(--ink-muted)">Won</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600;color:var(--critical)" id="losses-val">0</div>
            <div style="font-size:12px;color:var(--ink-muted)">Lost</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600" id="draws-val">0</div>
            <div style="font-size:12px;color:var(--ink-muted)">Drew</div>
          </div>
        </div>
      </div>

      <!-- Queue health meter (R11: due / DUE_SOFT_CAP) -->
      <div class="stat-tile">
        <div class="stat-tile__label">Queue health</div>
        <div class="queue-meter" style="margin-top:8px">
          <div class="queue-meter__track">
            <div class="queue-meter__fill" id="queue-fill" style="width:0%"></div>
          </div>
          <div class="queue-meter__caption" id="queue-caption">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Rating over time -->
    <div class="card" style="margin-top:24px">
      <div style="font-size:14px;font-weight:600;margin-bottom:16px">Rating over time</div>
      <canvas id="elo-chart" height="120" style="width:100%;display:block"></canvas>
    </div>

    <!-- Mistakes by phase -->
    <div class="card" style="margin-top:16px">
      <div style="font-size:14px;font-weight:600;margin-bottom:16px">Mistakes by phase</div>
      <div id="phase-bars" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>

    <!-- Focus recommendation -->
    <div class="card" id="focus-card" style="margin-top:16px;display:none">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">Focus area</div>
      <div id="focus-text" style="font-size:13px;color:var(--ink-secondary);line-height:1.5;margin-bottom:10px"></div>
      <a id="focus-drill-link" href="puzzles.html" class="btn btn--primary" style="font-size:13px">Drill this now →</a>
    </div>

    <!-- Top weakness -->
    <div class="card" id="weakness-card" style="margin-top:16px;display:none">
      <div style="font-size:14px;font-weight:600;margin-bottom:8px">Top weakness</div>
      <div id="dimension-text" style="font-size:13px;color:var(--ink-secondary);line-height:1.5;margin-bottom:8px"></div>
      <div id="weakness-text" style="font-size:13px;color:var(--ink-secondary);line-height:1.5"></div>
      <div id="weakness-bars" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>
    </div>

    <!-- Quality mix over time -->
    <div class="card" style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:14px;font-weight:600">Move quality mix</div>
        <button class="table-view-btn" id="quality-table-toggle" style="font-size:12px;color:var(--ink-muted);background:none;border:none;cursor:pointer">table view</button>
      </div>
      <div class="breakdown-bar" id="quality-bar"></div>
      <div id="quality-table-wrap" style="display:none;margin-top:8px">
        <table class="chart-table">
          <thead><tr><th>Tier</th><th class="num">Count</th><th class="num">%</th></tr></thead>
          <tbody id="quality-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/stats.js"></script>
</body>
</html>
