<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games — pawnbook</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div class="app-shell">
  <header class="top-bar">
    <a href="index.html" class="top-bar__brand">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.73V7h1.5l.5 1H13l1 3H4l1-3h1l.5-1H8V5.73A2 2 0 0 1 7 4a2 2 0 0 1 2-2zm-3 11h6v1H6v-1zm-1 2h8v1H5v-1z"/></svg>
      pawnbook
    </a>
    <nav class="top-bar__nav">
      <a href="index.html"   class="nav-link">Home</a>
      <a href="play.html"    class="nav-link">Play</a>
      <a href="puzzles.html" class="nav-link">Drill <span class="due-badge" id="due-count">0</span></a>
      <a href="games.html"       class="nav-link nav-link--active">Games</a>
      <a href="repertoire.html"  class="nav-link">Repertoire</a>
      <a href="stats.html"       class="nav-link">Stats</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <table class="games-table" id="games-table">
        <thead>
          <tr>
            <th></th>
            <th>Opponent</th>
            <th>Color</th>
            <th class="num" style="text-align:right">Accuracy</th>
            <th class="num" style="text-align:right">Strength</th>
            <th class="num" style="text-align:right">ELO Δ</th>
            <th class="num" style="text-align:right">Puzzles</th>
            <th>When</th>
          </tr>
        </thead>
        <tbody id="games-body">
          <tr><td colspan="8" style="color:var(--ink-muted);font-size:13px;padding:12px 4px">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div id="empty-games" class="empty-state" style="display:none">
      <div class="empty-state__message">Play your first game.</div>
      <a href="play.html" class="btn btn--primary">Play now</a>
    </div>
  </main>
</div>
<script type="module" src="js/games.js"></script>
</body>
</html>
