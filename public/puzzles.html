<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drill — pawnbook</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div class="app-shell">
  <header class="top-bar">
    <a href="index.html" class="top-bar__brand">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.73V7h1.5l.5 1H13l1 3H4l1-3h1l.5-1H8V5.73A2 2 0 0 1 7 4a2 2 0 0 1 2-2zm-3 11h6v1H6v-1zm-1 2h8v1H5v-1z"/></svg>
      pawnbook
    </a>
    <nav class="top-bar__nav">
      <a href="index.html"   class="nav-link">Home</a>
      <a href="play.html"    class="nav-link">Play</a>
      <a href="puzzles.html" class="nav-link nav-link--active">Drill <span class="due-badge" id="due-count">0</span></a>
      <a href="games.html"       class="nav-link">Games</a>
      <a href="repertoire.html"  class="nav-link">Repertoire</a>
      <a href="stats.html"       class="nav-link">Stats</a>
    </nav>
  </header>

  <main class="page">
    <!-- Empty state: nothing due -->
    <div id="empty-state" style="display:none">
      <div class="empty-state">
        <div class="empty-state__message" id="empty-heading" style="font-size:20px;font-weight:600">Nothing due — you're clear.</div>
        <div id="empty-session-summary" style="font-size:13px;color:var(--ink-muted);margin-bottom:4px;display:none"></div>
        <div id="empty-streak-line" style="font-size:13px;color:var(--ink-muted);margin-bottom:16px;display:none"></div>
        <div style="font-size:14px;color:var(--ink-muted);margin-bottom:16px" id="empty-sub">Play a game or drill ahead.</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a href="play.html" class="btn btn--primary">Play a game</a>
          <button class="btn btn--ghost" id="drill-ahead-btn">Drill ahead</button>
        </div>
      </div>
    </div>

    <!-- Motif filter banner (shown when ?motif= param is present) -->
    <div id="motif-filter-banner" style="display:none;margin-bottom:12px;padding:8px 12px;background:var(--surface-2);border-radius:6px;font-size:13px;color:var(--ink-secondary)">
      Drilling: <span id="motif-filter-label"></span> &nbsp;·&nbsp; <a href="puzzles.html" style="color:var(--accent)">show all</a>
    </div>

    <!-- Drill UI -->
    <div id="drill-ui" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-muted)">
          <span id="batch-progress">1</span> of <span id="batch-total">10</span>
          <span style="margin-left:8px;font-size:12px">from <a id="game-link" href="#" style="color:var(--ink-muted)">your game</a></span>
        </div>
        <div class="drill-pips" id="drill-pips"></div>
      </div>

      <div class="drill-layout">
        <div>
          <div class="board-wrap" id="board-wrap"></div>
        </div>
        <div class="drill-info">
          <div style="font-size:14px;font-weight:600" id="move-label"></div>
          <div class="drill-prompt" id="drill-prompt"></div>
          <div id="feedback-wrap"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px" id="action-btns">
            <button class="btn btn--ghost" id="hint-btn">Show hint</button>
            <button class="btn btn--ghost" id="skip-btn">Skip</button>
          </div>
          <div id="next-wrap" style="display:none;margin-top:8px">
            <button class="btn btn--primary" id="next-btn">Next</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Batch summary -->
    <div id="summary-state" style="display:none">
      <div class="card" style="max-width:400px;margin:0 auto;text-align:center">
        <div style="font-size:20px;font-weight:600;margin-bottom:8px">Batch complete</div>
        <div style="font-size:14px;color:var(--ink-secondary);margin-bottom:16px" id="summary-text"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn btn--primary btn--large" id="next-batch-btn">Drill more</button>
          <a href="play.html" class="btn btn--ghost btn--large">Play a game</a>
          <a href="index.html" class="btn btn--ghost">Home</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/puzzles.js"></script>
</body>
</html>
